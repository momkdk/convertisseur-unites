<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Convertisseur d'unités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : app une colonne — sélecteur de catégorie en onglets, deux champs reliés par une flèche */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F4; --ink:#13233B; --muted:#5A6B82;
  --line:#D7E0E8; --accent:#1F7A6C; --accent-ink:#FFFFFF;
  --display:'Barlow Condensed',sans-serif; --body:'Public Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A2B; --surface:#152439; --surface-2:#1C3049; --ink:#E7ECF2; --muted:#93A4BA;
    --line:#2A3E57; --accent:#4FD1BA; --accent-ink:#0E1A2B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A2B; --surface:#152439; --surface-2:#1C3049; --ink:#E7ECF2; --muted:#93A4BA;
  --line:#2A3E57; --accent:#4FD1BA; --accent-ink:#0E1A2B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px))}
.mark{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 6px;letter-spacing:.04em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);margin:8px 0 4px;text-wrap:balance}
.subtitle{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
@media (max-width:480px){.conv{grid-template-columns:1fr}}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input, .field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:15px;color:var(--ink)}
.arrow{font-family:var(--display);font-size:22px;color:var(--accent);padding-bottom:10px;text-align:center}
.result{margin-top:20px;padding:16px;background:var(--surface-2);border-radius:10px;text-align:center}
.result .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;color:var(--accent)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark">Outil gratuit</span>
    <h1>Convertisseur d'unités</h1>
    <div class="subtitle">Longueur, poids, volume, vitesse, température — calculé dans votre navigateur.</div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="conv">
      <div class="field">
        <label for="valeur">Valeur</label>
        <input id="valeur" type="number" value="10" step="any">
        <select id="uniteDepart" style="margin-top:8px"></select>
      </div>
      <div class="arrow">→</div>
      <div class="field">
        <label for="uniteArrivee">Résultat dans</label>
        <select id="uniteArrivee"></select>
      </div>
    </div>
    <div class="result"><div class="big" id="resultat"></div></div>
  </div>

  <footer>
    <span>Mohamed-Ali El Amri — développeur freelance Python &amp; IA, Cluses (Haute-Savoie)</span>
    <a href="https://github.com/momkdk/convertisseur-unites" target="_blank" rel="noopener">Code source (MIT)</a>
    <a href="https://github.com/momkdk" target="_blank" rel="noopener">Tous les outils</a>
  </footer>
</div>

<script>
function el(id){return document.getElementById(id)}

const CATEGORIES = {
  longueur: { unites:{mm:0.001,cm:0.01,m:1,km:1000,pouce:0.0254,pied:0.3048,yard:0.9144,mile:1609.344}, defD:'km', defA:'mile' },
  poids:    { unites:{mg:1e-6,g:0.001,kg:1,tonne:1000,once:0.028349523125,livre:0.45359237}, defD:'kg', defA:'livre' },
  volume:   { unites:{ml:0.001,cl:0.01,l:1,gallon_us:3.785411784,pinte_us:0.473176473}, defD:'l', defA:'gallon_us' },
  vitesse:  { unites:{'m/s':1,'km/h':1/3.6,mph:0.44704,noeud:0.5144444444444445}, defD:'km/h', defA:'mph' },
  temperature: { special:true, defD:'c', defA:'f' },
};
const LIBELLES_TEMP={c:'°C', f:'°F', k:'K'};

let categorieActive='longueur';

function construireOnglets(){
  el('tabs').innerHTML = Object.keys(CATEGORIES).map(c=>
    `<button class="tab ${c===categorieActive?'active':''}" data-cat="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</button>`
  ).join('');
  el('tabs').querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{categorieActive=b.dataset.cat; construireOnglets(); construireSelecteurs();}));
}

function construireSelecteurs(){
  const cat=CATEGORIES[categorieActive];
  const unites = cat.special ? ['c','f','k'] : Object.keys(cat.unites);
  const libelle = u => cat.special ? LIBELLES_TEMP[u] : u;
  el('uniteDepart').innerHTML = unites.map(u=>`<option value="${u}" ${u===cat.defD?'selected':''}>${libelle(u)}</option>`).join('');
  el('uniteArrivee').innerHTML = unites.map(u=>`<option value="${u}" ${u===cat.defA?'selected':''}>${libelle(u)}</option>`).join('');
  convertir();
}

function convertirTemperature(valeur, d, a){
  let celsius;
  if(d==='c') celsius=valeur;
  else if(d==='f') celsius=(valeur-32)*5/9;
  else celsius=valeur-273.15;
  if(a==='c') return celsius;
  if(a==='f') return celsius*9/5+32;
  return celsius+273.15;
}

function convertir(){
  const valeur=parseFloat(el('valeur').value);
  const d=el('uniteDepart').value, a=el('uniteArrivee').value;
  const out=el('resultat');
  if(!Number.isFinite(valeur)){ out.textContent='Entrez une valeur'; return }
  const cat=CATEGORIES[categorieActive];
  let resultat;
  if(cat.special){
    resultat=convertirTemperature(valeur, d, a);
  } else {
    resultat = valeur * cat.unites[d] / cat.unites[a];
  }
  const libelleA = cat.special ? LIBELLES_TEMP[a] : a;
  out.textContent = `${resultat.toLocaleString('fr-FR',{maximumFractionDigits:6})} ${libelleA}`;
}

['valeur','uniteDepart','uniteArrivee'].forEach(id=>el(id).addEventListener('input',convertir));
construireOnglets();
construireSelecteurs();
</script>
</body>
</html>
